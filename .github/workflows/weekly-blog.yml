name: Weekly Marzi Blog

on:
  schedule:
    - cron: '35 4 * * 5'  # Friday 10:00 AM IST (UTC+5:30)
  workflow_dispatch:        # Manual trigger for testing

permissions:
  contents: write
  id-token: write   # GitHub OIDC → AWS role

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-sentence-transformers-v1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::904233100956:role/aeo-blog-github-deploy
          aws-region: ap-south-1

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Fetch live pages from S3
        run: poetry run python fetch_pages.py

      - name: Run pipeline — generate, compile and deploy to S3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: poetry run python run_pipeline.py --auto 1

      - name: Commit weekly recommendations file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recommendations-*.json
          git diff --staged --quiet || git commit -m "chore: weekly blog recommendations $(date -u +%Y-%m-%d)"
          git push

      - name: Clean up fetched HTML files
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf site/public/*.html site/public/sitemap.xml site/public/robots.txt site/public/llms.txt
